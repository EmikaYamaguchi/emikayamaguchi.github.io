name: Add business contact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contact block
        shell: python
        run: |
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          marker = '<div class="business-contact">'
          if marker not in html:
              html = html.replace(
                  '<div class="profile-contact">',
                  '<div class="profile-contact">\n          <div class="business-contact">\n            <p>＜お問合せやお仕事のご依頼はこちら＞</p>\n            <a href="mailto:7jkha5nt.0ot@gmail.com">7jkha5nt.0ot@gmail.com</a>\n          </div>',
                  1,
              )
              index.write_text(html, encoding='utf-8')

          css = Path('style.css')
          text = css.read_text(encoding='utf-8')
          if '.business-contact{' not in text:
              text = text.replace(
                  '.profile-contact{margin-top:auto;padding-top:28px;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px}',
                  '.profile-contact{margin-top:auto;padding-top:32px;border-top:1px solid var(--line);display:flex;align-items:center;gap:18px;flex-wrap:wrap}.business-contact{width:100%;font:14px/1.8 "Zen Old Mincho",serif;color:#d8dad3}.business-contact p{margin:0 0 4px}.business-contact a{display:inline-block;font:13px/1.6 "DM Mono",monospace;color:var(--paper);border-bottom:1px solid currentColor;padding-bottom:2px}.business-contact a:hover{color:var(--lime)}',
                  1,
              )
              css.write_text(text, encoding='utf-8')
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git commit -m "Add mail contact link to profile"
          git push
