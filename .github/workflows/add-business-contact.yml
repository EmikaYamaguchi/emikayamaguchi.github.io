name: Add business contact

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add contact and framed services block
        shell: python
        run: |
          from pathlib import Path
          import base64, re

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')

          marker = '<div class="business-contact">'
          if marker not in html:
              html = html.replace(
                  '<div class="profile-contact">',
                  '<div class="profile-contact">\n          <div class="business-contact">\n            <p>お問合せ・お仕事のご依頼はこちら</p>\n            <p>インスタのDMまたは<a href="mailto:7jkha.5nt@gmail.com">7jkha.5nt@gmail.com</a>まで</p>\n          </div>',
                  1,
              )

          gallery_marker = '    <section class="panel gallery-panel" id="gallery" data-panel="gallery">'
          services = base64.b64decode('').decode('utf-8')
          services += base64.b64decode('').decode('utf-8')
          if 'class="emika-services"' not in html:
              if gallery_marker not in html:
                  raise SystemExit('Gallery marker not found')
              html = html.replace(gallery_marker, services + gallery_marker, 1)

          html = re.sub(r'style\.css\?v=[^"]+', 'style.css?v=services-20260826-2', html, count=1)
          index.write_text(html, encoding='utf-8')

          css = Path('style.css')
          text = css.read_text(encoding='utf-8')
          extra = base64.b64decode('').decode('utf-8')
          if '/* Emika: actual framed skills section between Profile and Gallery */' not in text:
              text += extra
          css.write_text(text, encoding='utf-8')
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git commit -m "Add framed services section above Gallery"
          git push
