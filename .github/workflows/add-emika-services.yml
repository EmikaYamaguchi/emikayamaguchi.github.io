name: Add Emika services section
on:
  push:
    paths:
      - '.github/workflows/add-emika-services.yml'
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Insert services block and styles
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text(encoding='utf-8')
          marker = '    <section class="panel gallery-panel" id="gallery" data-panel="gallery">'
          block = '''    <section class="emika-services" aria-labelledby="emika-services-title">
      <div class="emika-services-inner">
        <div class="emika-services-head">
          <p class="section-kicker">WHAT I CAN DO</p>
          <h2 id="emika-services-title">できること</h2>
        </div>
        <div class="emika-services-grid">
          <article><b>WEBサイト制作</b><p>GitHub Pages・Wixなどを使ったWebサイトの制作・更新。</p></article>
          <article><b>AIコンテンツ制作</b><p>ChatGPT・Claudeなどを活用した企画、文章、画像などの制作。</p></article>
          <article><b>動画企画・台本</b><p>YouTube・ショート動画の企画や台本、発信用コンテンツの制作。</p></article>
          <article><b>Canvaデザイン</b><p>メニュー、告知画像、SNS用画像などのデザイン制作。</p></article>
          <article><b>LINEスタンプ制作</b><p>AIを活用したスタンプ・絵文字の企画、画像制作。</p></article>
          <article><b>写真撮影</b><p>舞台、ライブ、イベント、祭りなどの撮影。</p></article>
          <article><b>パソコン基本操作・サポート</b><p>Windowsの基本操作や各種設定など、初心者向けの使い方をサポート。</p></article>
          <article><b>スマホ・ガジェット</b><p>スマホの基本操作・設定や、用途に合わせたガジェット選びをサポート。</p></article>
        </div>
      </div>
    </section>

'''
          if 'class="emika-services"' not in html:
              if marker not in html:
                  raise SystemExit('Gallery marker not found')
              html = html.replace(marker, block + marker, 1)
          html = html.replace('style.css?v=contact-sheet-7', 'style.css?v=contact-sheet-9')
          index.write_text(html, encoding='utf-8')

          css_path = Path('style.css')
          css = css_path.read_text(encoding='utf-8')
          start = css.find('/* Hide the old injected profile services if present */')
          if start != -1:
              media = css.find('@media(max-width:850px)', start)
              if media != -1:
                  css = css[:start] + css[media:]
          new_css = r'''

/* EMiKA services block: framed cards above Gallery */
.profile-services{display:none!important}
.emika-services{order:2;background:#0c0d0d;border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:48px 4vw 52px}
.emika-services-inner{border:1px solid var(--line);background:#0a0b0b}
.emika-services-head{display:flex;align-items:flex-end;justify-content:space-between;gap:24px;padding:24px 28px;border-bottom:1px solid var(--line)}
.emika-services-head h2{margin:0;font:500 clamp(30px,4vw,48px)/1.1 "Zen Old Mincho",serif;letter-spacing:.05em}
.emika-services-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr))}
.emika-services-grid article{min-height:126px;padding:20px 20px 18px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);background:#101111}
.emika-services-grid article:nth-child(4n){border-right:0}
.emika-services-grid article:nth-last-child(-n+4){border-bottom:0}
.emika-services-grid b{display:block;margin-bottom:10px;color:var(--paper);font:500 12px/1.5 "DM Mono",monospace;letter-spacing:.03em}
.emika-services-grid p{margin:0;color:var(--muted);font:13px/1.8 "Zen Old Mincho",serif}
.emika-services-grid article:hover{background:#121510}
.emika-services-grid article:hover b{color:var(--lime)}
body:has(.profile-panel.is-active) .emika-services,body:has(.gallery-panel.is-active) .emika-services{display:block!important}
body:has(.profile-panel.is-active) .emika-services,body:has(.gallery-panel.is-active) .emika-services{order:2!important}
body:has(.profile-panel.is-active) .gallery-panel,body:has(.gallery-panel.is-active) .gallery-panel{order:3!important}
@media(max-width:900px){.emika-services-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.emika-services-grid article:nth-child(4n){border-right:1px solid var(--line)}.emika-services-grid article:nth-child(2n){border-right:0}.emika-services-grid article:nth-last-child(-n+4){border-bottom:1px solid var(--line)}.emika-services-grid article:nth-last-child(-n+2){border-bottom:0}}
@media(max-width:850px){.emika-services{padding:30px 5vw 34px}.emika-services-head{padding:20px}.emika-services-head h2{font-size:34px}.emika-services-grid{grid-template-columns:1fr}.emika-services-grid article{min-height:0;padding:18px;border-right:0!important;border-bottom:1px solid var(--line)!important}.emika-services-grid article:last-child{border-bottom:0!important}.emika-services-grid b{font-size:11px}.emika-services-grid p{font-size:12px}}
'''
          css += new_css
          css_path.write_text(css, encoding='utf-8')
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html style.css
          git diff --cached --quiet || git commit -m "Add framed services section above Gallery"
          git push
